version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.8
    commands:
      - curl -sLo kubectl https://amazon-eks.s3.us-east-1.amazonaws.com/latest/amazon-eks kubectl-linux-amd64
      - chmod +x ./kubectl
      - mv ./kubectl /usr/local/bin/kubectl
      - aws eks --region us-east-1 update-kubeconfig --name test
  build:
    commands:
      - kubectl apply -f service.yaml
